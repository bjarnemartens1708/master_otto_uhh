<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OTTO Prototypen</title>
<link rel="stylesheet" href="ds/otto/tokens/colors.css">
<link rel="stylesheet" href="ds/otto/tokens/typography.css">
<link rel="stylesheet" href="ds/otto/tokens/layout.css">
<link rel="stylesheet" href="ds/otto/styles.css">
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--oc-base-color-gray-25, #f7f7f7); }
  body { font-family: var(--oc-base-font-family, 'OTTO Sans', 'Helvetica Neue', Arial, sans-serif); color: #111; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 48px 24px calc(48px + env(safe-area-inset-bottom)); padding-top: calc(48px + env(safe-area-inset-top)); }
  .card { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 1px 2px rgba(17,17,17,.08); }
  .card + .card { margin-top: 12px; }
  .chev { flex: none; color: var(--oc-base-color-gray-400, #767676); font-size: 22px; line-height: 1; }
  .badge { flex: none; width: 56px; height: 56px; border-radius: 14px; background: var(--oc-base-color-hint-purple-100, #6b3fa0); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
</style>
</head>
<body>
  <div class="wrap">
    <div style="font-weight: 700; font-size: 26px; line-height: 1.2; margin-bottom: 8px;">Prototypen</div>
    <div style="font-size: 15px; line-height: 1.45; color: var(--oc-base-color-gray-400, #767676); margin-bottom: 32px;">Wähle einen Prototyp für das Interview.</div>

    <a class="card" href="fashion/">
      <span class="badge">F</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-weight: 700; font-size: 17px;">Outfit-Generator</span>
        <span style="font-size: 13px; line-height: 1.4; color: var(--oc-base-color-gray-400, #767676);">Fashion — Outfit generieren und virtuell anprobieren</span>
      </span>
      <span class="chev">›</span>
    </a>

    <a class="card" href="furniture-finder/">
      <span class="badge">FF</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-weight: 700; font-size: 17px;">Furniture Finder</span>
        <span style="font-size: 13px; line-height: 1.4; color: var(--oc-base-color-gray-400, #767676);">Einzelnes Möbelstück austauschen</span>
      </span>
      <span class="chev">›</span>
    </a>

    <a class="card" href="room-builder/">
      <span class="badge">RB</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-weight: 700; font-size: 17px;">Room Builder</span>
        <span style="font-size: 13px; line-height: 1.4; color: var(--oc-base-color-gray-400, #767676);">Kompletten Raum neu einrichten</span>
      </span>
      <span class="chev">›</span>
    </a>
  </div>
</body>
</html>
